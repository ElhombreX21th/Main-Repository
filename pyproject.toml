[project]
name = "reembolsabr"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.116.1",
    "uvicorn[standard]==0.35.0",
    "sqlalchemy==2.0.43",
    "psycopg[binary]==3.2.9",
    "alembic==1.16.4",
    "pydantic==2.11.7",
    "pydantic-settings==2.10.1",
    "PyJWT==2.10.1",
    "pwdlib[argon2]==0.2.1",
    "python-multipart==0.0.20",
    "celery[redis]==5.5.3",
    "redis>=5.0.3,<=5.2.1",
    "email-validator==2.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"] # FastAPI intentionally declares dependencies in parameter defaults.

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
