[project]
name = "reembolsabr"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008"] # FastAPI intentionally declares dependencies in parameter defaults.

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
